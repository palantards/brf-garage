<style>
        body {
            background-color: #f9fafb; /* gray-50 fallback */
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            background: linear-gradient(135deg, #0053db 0%, #0048c1 100%);

            box-shadow: 0 12px 32px rgba(43, 52, 55, 0.06);

<body class="bg-surface min-h-screen flex flex-col items-center justify-center p-6 text-on-surface">
<div class="w-full max-w-md">
<!-- Brand Identity Spot -->
<div class="flex justify-center mb-12">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-primary-gradient rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-white" data-icon="garage">garage</span>
</div>
<span class="font-headline font-extrabold text-2xl tracking-tight">BRF Garage</span>
</div>
</div>
<!-- Main Invitation Card -->
<main class="bg-surface-container-lowest architectural-shadow rounded-xl p-8 md:p-12 relative overflow-hidden">
<!-- Decorative Element: Architectural Accent -->
<div class="absolute top-0 right-0 w-24 h-1 bg-primary-gradient opacity-80"></div>
<div class="mb-10 text-center">
<h1 class="font-headline text-display-lg text-3xl font-bold text-on-surface mb-3 tracking-tight">Välkommen till BRF Garage</h1>
<p class="font-body text-on-surface-variant leading-relaxed">Skapa ditt lösenord för att komma igång.</p>
</div>
<form class="space-y-6">
<!-- Input Group 1 -->
<div class="space-y-2">
<label class="block font-label text-label-sm uppercase tracking-wider font-semibold text-on-surface-variant ml-1" for="password">
                        Lösenord
                    </label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-2 border-outline-variant border-opacity-20 rounded-xl px-4 py-3.5 focus:border-primary focus:ring-0 transition-all outline-none text-on-surface" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Input Group 2 -->
<div class="space-y-2">
<label class="block font-label text-label-sm uppercase tracking-wider font-semibold text-on-surface-variant ml-1" for="confirm-password">
                        Bekräfta lösenord
                    </label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-2 border-outline-variant border-opacity-20 rounded-xl px-4 py-3.5 focus:border-primary focus:ring-0 transition-all outline-none text-on-surface" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Validation Hint -->
<div class="flex items-start gap-2 py-2">
<span class="material-symbols-outlined text-outline text-sm" data-icon="info">info</span>
<p class="text-xs text-on-surface-variant leading-normal">
                        Lösenordet måste vara minst 8 tecken långt och innehålla både bokstäver och siffror.
                    </p>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-gradient text-on-primary font-body font-semibold py-4 rounded-full shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="submit">
<span>Aktivera konto</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</main>
<!-- Contextual Meta -->
<footer class="mt-8 text-center space-y-4">
<p class="font-body text-label-sm text-outline tracking-normal">
                Inbjuden av <span class="text-on-surface-variant font-medium">Brf Solbacken</span>
</p>
<div class="pt-8 flex justify-center gap-6 opacity-40">
